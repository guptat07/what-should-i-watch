<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="src/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Noto+Serif:wdth,wght@62.5..100,100..900&display=swap" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>What Should I Watch?</title>
  </head>
  <body>
    <nav>
      <div class="navbar">
        <ul>
          <li><a href="index.html"><img src="src/assets/WSIW.png" alt="What Should I Watch Homepage"></a></li>
          <li><a href="about.html">About</a></li>
        </ul>
      </div>
    </nav>
    <div class="container">
      <img id="site-logo" src="src/assets/WHAT SHOULD I WATCH.png" alt="What Should I Watch logo">
      <!-- <h1><span class="stroke">WHAT<br>SHOULD I<br></span>WATCH?</h1> -->
      <form id="form">
        <div class="search">
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <path
              d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 
              3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 
              19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"
            />
          </svg>
          <input
            aria-label="Search for movies by describing what you're in the mood to watch"
            autocomplete="off"
            inputmode="search"
            type="search"
            name="user-input"
            id="user-input"
            placeholder="A sci-fi movie from the 80s!"
          />
        </div>
        <input type="submit" name="submit" id="submit" value="SEARCH MOVIES">
      </form>
      <div id="output-container"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
    
    <footer>
      <p>© 2026 Tony Gupta. All rights reserved.</p>
    </footer>
  </body>
